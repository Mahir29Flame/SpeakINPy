[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "speakinpy"
version = "0.1.2"
description = "A Python module for recorded audio transcription via Gemini API"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "google-genai>=2.33.0",
]

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = false

[tool.setuptools.packages.find]
where = ["src"]
include = ["speakinpy"]
