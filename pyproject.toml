[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "TranscribeNPy"
version = "0.1.2"
description = "A Python module for recorded audio transcription via Wispr with groq API"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "groq>=1.7.0",
]

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = false

[tool.setuptools.packages.find]
where = ["src"]
include = ["transcribenpy"]
