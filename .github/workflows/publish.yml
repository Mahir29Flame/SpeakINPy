name: Build and publish package

on:
  pull_request:
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      publish_testpypi:
        description: "Publish this run's artifacts to TestPyPI"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  build:
    name: Build and validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build tools
        run: python -m pip install --upgrade pip build twine

      - name: Build sdist and wheel
        run: python -m build

      - name: Validate package metadata
        run: python -m twine check dist/*

      - name: Validate distribution contents
        run: |
          python - <<'PY'
          import pathlib
          import tarfile
          import zipfile

          dist = pathlib.Path("dist")
          archives = list(dist.glob("*.tar.gz")) + list(dist.glob("*.whl"))
          assert archives, "No distribution artifacts found in dist/"

          for artifact in archives:
            names = []
            if artifact.suffix == ".whl":
              with zipfile.ZipFile(artifact) as zf:
                names = zf.namelist()
            else:
              with tarfile.open(artifact, "r:gz") as tf:
                names = tf.getnames()

            bad = [name for name in names if "examples/audio" in name or name.startswith("examples/")]
            if bad:
              raise SystemExit(f"Unexpected example files in {artifact.name}: {bad}")
          PY

      - name: Install wheel in clean environment
        run: |
          python -m venv .venv-check
          . .venv-check/bin/activate
          python -m pip install --upgrade pip
          python -m pip install --no-deps dist/*.whl
          python -c "import importlib.metadata as md; print(md.version('speakinpy'))"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: python-distributions
          path: dist/

  publish-testpypi:
    name: Publish to TestPyPI
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && inputs.publish_testpypi
    permissions:
      id-token: write
      contents: read
    environment:
      name: testpypi
      url: https://test.pypi.org/p/speakinpy

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: python-distributions
          path: dist/

      - name: Publish package to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  publish-pypi:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'release'
    permissions:
      id-token: write
      contents: read
    environment:
      name: pypi
      url: https://pypi.org/p/speakinpy

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: python-distributions
          path: dist/

      - name: Publish package to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
